  supersedes: INIT-PROFILE-001
  record: .planning/agt/profile-upgrade-2.0.0.md
  fit:
  - 面向个人消费者的公开 Web 产品
  - AI 生成内容是核心用户价值
  - 支持匿名访客、注册用户和权益分组
  - 需要 OpenRouter 模型路由、调用配额、成本控制和流式返回
  - 首个里程碑需要产品、设计、数据库、前后端与验证完整闭环
  checked_mismatches:
  - 首版不是企业多租户或复杂组织权限产品
  - 首版不做原生移动端、桌面端或离线优先
  - 产品不直接产生医疗、金融或法律等高风险专业决策
  - 首版不依赖大规模人工审核、实时多人协作或无界面 API 交付
  defaults_status: PROPOSED
  defaults_rule: Profile 默认倾向必须由相应专业角色分析，不能自动视为用户已确认决策。
  tradeoffs:
  - 完整阶段和正式产物提高可追踪性，但比只做原型需要更多审批。
  - AI 输出契约、失败恢复和评估提高可靠性，但增加首版设计与测试工作。
  - 统一权益组模型便于后续演进，但首版即需明确组别、额度和管理员边界。
